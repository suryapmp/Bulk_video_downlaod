<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🎬 Video Downloader</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-10">
  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-3xl">
    <h1 class="text-3xl font-bold text-center mb-6 text-indigo-600">📥 Exam Video Downloader</h1>

    <form id="uploadForm" class="space-y-4">
      <input type="file" name="file" id="excelFile" accept=".xlsx" required class="w-full border p-2 rounded" />
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 w-full">Upload Excel</button>
    </form>

    <div id="pathSelector" class="hidden mt-6">
      <label class="block mb-2 text-gray-700 font-medium">Select Download Folder Path:</label>
      <input type="text" id="downloadPath" placeholder="e.g. D:/ExamVideos" class="w-full border p-2 rounded mb-3">
      <button id="startBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full">Start Download</button>
    </div>
  </div>

  <div id="logs" class="mt-10 w-full max-w-5xl"></div>

  <script>
    const uploadForm = document.getElementById("uploadForm");
    const pathSelector = document.getElementById("pathSelector");
    const downloadPath = document.getElementById("downloadPath");
    let taskData = null;

    uploadForm.onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(uploadForm);
      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      if (data.error) alert(data.error);
      else {
        taskData = data.tasks;
        pathSelector.classList.remove("hidden");
        alert(`Excel processed ✅ Found ${data.total_videos} videos.`);
      }
    };

    document.getElementById("startBtn").onclick = async () => {
      const path = downloadPath.value.trim();
      if (!path) return alert("Please enter a download path.");
      const fd = new FormData();
      fd.append("path", path);
      fd.append("tasks", JSON.stringify(taskData));
      const res = await fetch("/start_downloads", { method: "POST", body: fd });
      const data = await res.json();
      alert(data.message);
    };

    const ws = new WebSocket(`ws://${window.location.host}/ws`);
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      const logs = document.getElementById("logs");
      const id = `${d.roll_no}-${d.course}`;
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement("div");
        el.id = id;
        el.className = "border p-3 rounded mb-2 bg-white shadow";
        logs.appendChild(el);
      }
      el.innerHTML = `
        <div class="flex justify-between">
          <div><b>${d.roll_no}</b> | ${d.course} | ${d.program}</div>
          <div>${d.status}</div>
        </div>
        <div class="h-2 bg-gray-200 rounded mt-2">
          <div class="bg-indigo-500 h-2 rounded" style="width:${d.progress}%"></div>
        </div>
        <div class="text-sm text-gray-600 mt-1">Progress: ${d.progress}% | Speed: ${d.speed} | Size: ${d.size}</div>
      `;
    };
  </script>
</body>
</html>
